[project]
name = "kicad-circuit-ai"
version = "0.1.0"
description = "Circuit Intelligence Layer for KiCad — detects logic errors that ERC/DRC cannot"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Sebas Velandia", email = "sebastianvelace@gmail.com" }]
keywords = ["kicad", "mcp", "pcb", "electronics", "circuit-validation", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "sexpdata>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
kicad-circuit-ai = "kicad_circuit_ai.server:main"

[project.entry-points."mcp.servers"]
kicad-circuit-ai = "kicad_circuit_ai.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_circuit_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
